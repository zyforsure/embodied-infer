[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-infer-deploy"
version = "0.1.0"
description = "Python deployment adapters for embodied-infer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "msgpack>=1.0",
    "numpy>=1.24",
    "websockets>=14",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
embodied-infer-server = "embodied_infer_deploy.server:main"
embodied-infer-smoke = "embodied_infer_deploy.smoke:main"
embodied-infer-robotwin = "embodied_infer_deploy.simulators.robotwin.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/simulators"]
markers = [
    "robotwin: requires an external RoboTwin simulator installation",
]
